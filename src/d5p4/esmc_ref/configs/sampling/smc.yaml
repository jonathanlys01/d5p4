# @package _global_
# SMC sampling configuration

sampling:
  method: smc
  predictor: ddpm_cache
  steps: 128
  noise_removal: True
  num_sample_batches: 8
  num_sample_log: 2
  semi_ar: False
  stride_length: 1
  num_strides: 1
  num_particles: 8  # Not used by SMC (uses smc.num_particles)

# SMC uses the smc section from main config for its specific parameters

