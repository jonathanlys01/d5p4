[project]
name = "d5p4"
version = "0.1.0"
description = "Partition Determinantal Point Process for Diversity in Parallel Discrete Diffusion Decoding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.57.0",
    "torch>=2.7.0",
    "omegaconf>=2.3.0",
    "dppy>=0.3.3",
    "idr-torch>=2.4.0",
    "scikit-learn>=1.7.2",
    "faiss-cpu>=1.12.0",
    "optuna>=4.5.0",
    "datasets>=4.4.1",
    "tiktoken>=0.12.0",
    "pot>=0.9.6.post1",
    "sacrebleu>=2.5.1",
    "nltk>=3.9.2",
    "latex2sympy2>=1.5.4",
    "hydra-core>=1.3.2",
    "lightning>=2.6.1",
    "timm>=1.0.26",
    "pydantic>=2.13.3",
]

[dependency-groups]
dev = [
    "flash-attn>=2.8.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-ml-py",
]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]


#########################################################

[tool.ruff]

line-length = 120
indent-width = 4

[tool.ruff.lint]
extend-select = [
    "ARG", # flake8-unused-arguments
    "C90", # mccabe complexity
    "COM", # commas 
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "PL",  # pylint
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "W",   # pycodestyle warnings
]
ignore = [
    "C901",    # too complex
    "PLR2004", # magic number
    "PLR0915", # too many statements
    "PLR0912", # too many branches
    "PLR0913", # too many variables
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

# external modelling code
"src/d5p4/llada_ref/*" = ["ALL"]
"src/d5p4/mdlm_ref/*" = ["ALL"]
"src/d5p4/mauve/*" = ["ALL"]
"src/d5p4/jina_ref/*" = ["ALL"]
"src/d5p4/esmc_ref/*" = ["ALL"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-third-party = ["idr_torch"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pyrefly]
project-excludes = [
    "src/d5p4/jina_ref",
    "src/d5p4/llada_ref",
    "src/d5p4/mdlm_ref",
    "src/d5p4/esmc_ref",
    "src/d5p4/mauve",
    "tests",
] # external sources

[tool.pyrefly.errors]
untyped-import = false
